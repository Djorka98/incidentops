<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IncidentOps API</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            place-items: center;
            color: #f4f7fb;
            background: #080b10;
        }

        main {
            width: min(90vw, 22rem);
            padding: 2.25rem;
            text-align: center;
            background: #0e131b;
            border: 1px solid #202938;
            border-radius: 1rem;
            box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 25%);
        }

        .status {
            display: inline-flex;
            gap: 0.55rem;
            align-items: center;
            padding: 0.45rem 0.75rem;
            color: #baf7cf;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            background: #11251a;
            border: 1px solid #214b30;
            border-radius: 999px;
        }

        .indicator {
            width: 0.55rem;
            height: 0.55rem;
            background: #35d06f;
            border-radius: 50%;
            box-shadow: 0 0 0 0.2rem rgb(53 208 111 / 12%);
        }

        h1 {
            margin: 1.25rem 0 0;
            font-size: clamp(1.35rem, 5vw, 1.7rem);
            font-weight: 600;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>
<main aria-labelledby="service-name">
    <div class="status" role="status">
        <span class="indicator" aria-hidden="true"></span>
        <span>API ON</span>
    </div>
    <h1 id="service-name">IncidentOps API</h1>
</main>
</body>
</html>
