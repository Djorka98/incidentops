spring.application.name=incidentops
server.port=${PORT:8080}

app.cors.allowed-origins=${FRONTEND_URLS:${FRONTEND_URL:http://localhost:5173}}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema before Flyway
spring.flyway.validate-on-migrate=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.from-address=${RESEND_FROM_EMAIL:}
app.email.from-name=${RESEND_FROM_NAME:IncidentOps}
app.email.cron-secret=${CRON_SECRET:}
