spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy

# Flyway is the production schema authority. Schema completeness remains covered by
# FlywayMigrationIntegrationTest with Hibernate validation enabled explicitly there.
spring.jpa.hibernate.ddl-auto=none

# Vercel instances should not keep a fixed set of idle Neon connections. Flyway
# performs the eager connectivity/schema check, so Hikari need not open and close
# a separate validation connection before Flyway requests one.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000
